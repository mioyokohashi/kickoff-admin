<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>入場管理デバッグ</title>
<style>
body{background:#04080f;color:#fff;font-family:sans-serif;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
button{width:100%;max-width:320px;padding:16px;font-size:16px;font-weight:700;border:none;border-radius:12px;cursor:pointer}
.b1{background:#0088ff;color:#fff}
.b2{background:#00aa44;color:#fff}
.b3{background:#aa4400;color:#fff}
#log{width:100%;max-width:320px;background:#111;border:1px solid #333;border-radius:8px;padding:16px;font-family:monospace;font-size:12px;min-height:120px;white-space:pre-wrap;color:#0f0}
video{width:100%;max-width:320px;border-radius:8px;display:none}
</style>
</head>
<body>
<h2>デバッグ画面</h2>
<div id="log">ログ開始待ち...\n</div>
<button class="b1" id="btn1">① ボタンテスト</button>
<button class="b2" id="btn2">② mediaDevices確認</button>
<button class="b3" id="btn3">③ カメラ起動テスト</button>
<video id="video" playsinline autoplay muted></video>

<script>
function log(msg) {
  var el = document.getElementById("log");
  el.textContent += msg + "\n";
}

log("ページ読み込み完了");
log("userAgent: " + navigator.userAgent.substring(0, 80));

document.getElementById("btn1").addEventListener("click", function() {
  log("✓ ボタン1 クリック検知OK");
  alert("ボタン反応OK！");
});

document.getElementById("btn2").addEventListener("click", function() {
  log("② mediaDevices確認中...");
  if (!navigator.mediaDevices) {
    log("✗ navigator.mediaDevices なし");
    alert("mediaDevices なし");
    return;
  }
  log("✓ navigator.mediaDevices あり");
  if (!navigator.mediaDevices.getUserMedia) {
    log("✗ getUserMedia なし");
    alert("getUserMedia なし");
    return;
  }
  log("✓ getUserMedia あり");
  alert("mediaDevices OK!");
});

document.getElementById("btn3").addEventListener("click", function() {
  log("③ カメラ起動試行...");
  navigator.mediaDevices.getUserMedia({ video: true })
  .then(function(stream) {
    log("✓ カメラ取得成功！");
    var v = document.getElementById("video");
    v.style.display = "block";
    v.srcObject = stream;
    alert("カメラ成功！");
  })
  .catch(function(err) {
    log("✗ エラー: " + err.name + " / " + err.message);
    alert("エラー: " + err.name + "\n" + err.message);
  });
});
</script>
</body>
</html>
